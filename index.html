<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>樂華天主教小學 - 教師個人時間表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0c1526;
  --navy-800:#101c33;
  --navy-700:#16233e;
  --blue-600:#3457d5;
  --blue-500:#4a6bea;
  --blue-100:#e7ecfc;
  --amber-500:#e5922e;
  --amber-100:#fbe9d3;
  --red-500:#e0524a;
  --red-100:#fbdedc;
  --violet-500:#8b5fc9;
  --violet-100:#ece3f8;
  --grey-400:#94a3b8;
  --grey-100:#eef1f6;
  --bg:#f3f5fa;
  --card:#ffffff;
  --border:#e3e7f0;
  --text:#1b2436;
  --text-muted:#667085;
  --today-ring:#3457d5;
  --radius:12px;
  --font-cjk:'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-num:'Inter', var(--font-cjk);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-cjk);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}

/* ---------- App shell ---------- */
.app{
  max-width:1400px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- Top bar (school name + teacher select) ---------- */
.topbar{
  background:var(--navy-900);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.school-name{
  color:#fff;
  font-weight:700;
  font-size:15px;
  letter-spacing:.5px;
  display:flex;
  align-items:center;
  gap:8px;
}
.school-name .sub{
  color:#8fa0c9;
  font-weight:500;
  font-size:12.5px;
}
.teacher-select-wrap{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
}
.teacher-select-wrap label{
  color:#8fa0c9;
  font-size:12.5px;
  font-weight:500;
  white-space:nowrap;
}
select#teacherSelect{
  appearance:none;
  -webkit-appearance:none;
  background:var(--navy-700) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%238fa0c9"/></svg>') no-repeat right 12px center;
  color:#fff;
  border:1px solid #263457;
  border-radius:8px;
  padding:8px 32px 8px 14px;
  font-size:14px;
  font-weight:600;
  font-family:inherit;
  min-width:150px;
}
select#teacherSelect:focus{outline:2px solid var(--blue-500); outline-offset:1px;}

/* ---------- Header / calendar controls ---------- */
.calheader{
  background:var(--navy-800);
  color:#fff;
  padding:16px 20px 0 20px;
}
.calheader-title{
  text-align:center;
  font-family:var(--font-num);
  font-weight:800;
  font-size:22px;
  letter-spacing:.5px;
  padding-bottom:12px;
}
.calheader-title .weekbadge{
  display:inline-block;
  margin-left:10px;
  font-size:12px;
  font-weight:600;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  padding:3px 10px;
  border-radius:20px;
  vertical-align:middle;
  color:#c8d3ee;
  letter-spacing:0;
}
.calheader-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:14px;
  gap:10px;
  flex-wrap:wrap;
}
.nav-group{
  display:flex;
  align-items:center;
  gap:6px;
  position:relative;
}
.icon-btn{
  background:var(--navy-700);
  border:1px solid #263457;
  color:#e7ecfc;
  width:36px;
  height:36px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .15s;
}
.icon-btn:hover{background:#1c2a4a;}
.icon-btn:active{transform:translateY(1px);}
.today-btn{
  background:var(--navy-700);
  border:1px solid #263457;
  color:#fff;
  height:36px;
  padding:0 16px;
  border-radius:9px;
  font-weight:600;
  font-size:13.5px;
}
.today-btn:hover{background:#1c2a4a;}
.view-toggle{
  display:flex;
  background:var(--navy-700);
  border:1px solid #263457;
  border-radius:9px;
  overflow:hidden;
}
.view-toggle button{
  border:none;
  background:transparent;
  color:#9fb0d6;
  font-weight:700;
  font-size:13.5px;
  padding:8px 18px;
  transition:background .15s,color .15s;
}
.view-toggle button.active{
  background:var(--blue-600);
  color:#fff;
}

/* Calendar popover */
.calendar-pop{
  position:absolute;
  top:44px;
  left:0;
  z-index:50;
  background:#fff;
  color:var(--text);
  border-radius:var(--radius);
  box-shadow:0 12px 32px rgba(10,20,50,.28);
  width:300px;
  padding:14px;
  display:none;
}
.calendar-pop.open{display:block;}
.calendar-pop-tabs{
  display:flex;
  background:var(--grey-100);
  border-radius:8px;
  padding:3px;
  margin-bottom:12px;
}
.calendar-pop-tabs button{
  flex:1;
  border:none;
  background:transparent;
  padding:7px 0;
  font-size:12.5px;
  font-weight:700;
  border-radius:6px;
  color:var(--text-muted);
}
.calendar-pop-tabs button.active{
  background:#fff;
  color:var(--blue-600);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.cp-panel{display:none;}
.cp-panel.active{display:block;}
.cp-month-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.cp-month-nav .label{font-weight:700; font-size:14px;}
.cp-month-nav button{
  background:var(--grey-100);
  border:none;
  width:26px;height:26px;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);
}
.cp-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  text-align:center;
}
.cp-grid .dow{
  font-size:11px;
  color:var(--text-muted);
  font-weight:700;
  padding-bottom:4px;
}
.cp-day{
  font-size:12.5px;
  padding:6px 0;
  border-radius:6px;
  font-family:var(--font-num);
  color:var(--text);
  background:transparent;
  border:none;
}
.cp-day.out{color:#c8cedb;}
.cp-day.weekend{color:#c8cedb; cursor:default;}
.cp-day.school:hover{background:var(--blue-100); cursor:pointer;}
.cp-day.today{box-shadow:inset 0 0 0 1.5px var(--blue-600); font-weight:800;}
.cp-day.selected{background:var(--blue-600); color:#fff; font-weight:800;}
.cp-day.disabled{cursor:default; color:#dde1ea;}
.week-list{max-height:280px; overflow-y:auto;}
.week-item{
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:6px;
  font-size:12.5px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.week-item:hover{border-color:var(--blue-500); background:var(--blue-100);}
.week-item b{font-family:var(--font-num); color:var(--blue-600); font-size:13px;}
.week-item .range{color:var(--text-muted); font-size:11.5px; font-family:var(--font-num);}

/* ---------- Legend ---------- */
.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  padding:10px 20px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  font-size:11.5px;
  color:var(--text-muted);
}
.legend .dot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:middle;}

/* ---------- Grid ---------- */
.grid-wrap{
  flex:1;
  overflow-x:auto;
  background:var(--card);
  padding:0 0 24px 0;
}
table.tt{
  border-collapse:separate;
  border-spacing:0;
  width:100%;
  table-layout:fixed;
  min-width:640px;
}
table.tt th, table.tt td{
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
}
table.tt th:first-child, table.tt td:first-child{border-left:1px solid var(--border);}

.col-label{width:110px;}
body.day-view table.tt{min-width:0;}
body.day-view table.tt .col-label{width:96px;}
body.day-view th.daycol{min-width:0;}

th.corner{
  background:var(--grey-100);
  color:var(--text-muted);
  font-size:12px;
  font-weight:700;
  padding:10px 8px;
  border-top:1px solid var(--border);
  position:sticky; left:0; z-index:3;
}
th.daycol{
  background:var(--blue-600);
  color:#fff;
  padding:10px 6px 12px;
  text-align:center;
  border-top:1px solid var(--border);
  min-width:120px;
}
th.daycol .wd{font-size:12.5px; font-weight:600; opacity:.92;}
th.daycol .dnum{font-family:var(--font-num); font-size:22px; font-weight:800; line-height:1.25; margin:1px 0 4px;}
th.daycol.is-today{background:var(--amber-500);}
.badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  padding:2.5px 9px;
  border-radius:20px;
  background:rgba(255,255,255,.16);
  color:#fff;
}
.badge.unset{background:rgba(255,255,255,.14); color:#e2e8f5;}
.badge.special-S{background:var(--amber-100); color:#8a5216;}
.badge.special-E{background:var(--red-100); color:#9c332c;}
.badge.special-TD{background:var(--violet-100); color:#5b3a8f;}

td.period-label{
  background:var(--grey-100);
  padding:9px 10px;
  font-size:12.5px;
  font-weight:700;
  color:var(--text);
  vertical-align:middle;
  position:sticky; left:0; z-index:2;
  line-height:1.5;
}
td.period-label .time{display:block; font-size:11px; font-weight:500; color:var(--text-muted); font-family:var(--font-num);}

tr.fixed-row td.cell{
  background:repeating-linear-gradient(135deg, #eef1f8, #eef1f8 6px, #e5e9f3 6px, #e5e9f3 12px);
}
tr.fixed-row td.period-label{background:var(--grey-100);}

td.cell{
  padding:8px 8px;
  vertical-align:middle;
  text-align:center;
  font-size:12.5px;
  height:52px;
  color:var(--text);
}
td.cell.is-today{background:#fff8ec;}
tr.fixed-row td.cell.is-today{background:repeating-linear-gradient(135deg, #fff2d8, #fff2d8 6px, #ffe9bd 6px, #ffe9bd 12px);}
td.cell .subj{font-weight:700; display:block; margin-bottom:2px;}
td.cell .loc{display:block; font-size:11px; color:var(--text-muted);}
td.cell .fixed-main{font-weight:700; display:block;}
td.cell .fixed-sub{display:block; font-size:11px; color:var(--text-muted); margin-top:2px;}
td.cell.empty{color:#d7dbe6;}
td.cell.empty::before{content:"—";}
td.cell.merged{font-weight:700; color:var(--text); background:none !important; letter-spacing:.5px;}

.daybanner{
  margin:16px 20px 0;
  padding:14px 16px;
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13.5px;
}
.daybanner.special-S{background:var(--amber-100); color:#8a5216;}
.daybanner.special-E{background:var(--red-100); color:#9c332c;}
.daybanner.special-TD{background:var(--violet-100); color:#5b3a8f;}
.daybanner.unset{background:var(--grey-100); color:var(--text-muted);}
.daybanner.weekend{background:var(--grey-100); color:var(--text-muted);}
.daybanner b{font-weight:800;}

.day-single-head{
  text-align:center;
  padding:18px 20px 4px;
}
.day-single-head .dow{font-size:14px; color:var(--text-muted); font-weight:600;}
.day-single-head .dnum{font-family:var(--font-num); font-size:34px; font-weight:800; margin:2px 0;}
.day-single-head .badge{margin-top:2px;}

@media (max-width:768px){
  .topbar{padding:12px 14px;}
  .school-name{font-size:13px;}
  .school-name .sub{display:none;}
  .calheader{padding:12px 14px 0;}
  .calheader-title{font-size:17px;}
  .legend{padding:8px 14px; gap:10px; font-size:10.5px;}
  .grid-wrap{padding-bottom:16px;}
  th.daycol .dnum{font-size:18px;}
  td.cell{font-size:11.5px; height:46px;}
  .calendar-pop{width:260px; left:auto; right:0;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="school-name">樂華天主教小學<span class="sub">教師個人時間表</span></div>
    <div class="teacher-select-wrap">
      <label for="teacherSelect">教師</label>
      <select id="teacherSelect"></select>
    </div>
  </div>

  <div class="calheader">
    <div class="calheader-title" id="calTitle"></div>
    <div class="calheader-controls">
      <div class="nav-group">
        <button class="icon-btn" id="prevBtn" aria-label="上一頁" title="上一頁">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="today-btn" id="todayBtn">今日</button>
        <button class="icon-btn" id="calBtn" aria-label="選擇日期" title="選擇日期">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" aria-label="下一頁" title="下一頁">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="calendar-pop" id="calPop">
          <div class="calendar-pop-tabs">
            <button class="active" id="tabDate" data-tab="date">按日期</button>
            <button id="tabWeek" data-tab="week">按循環週</button>
          </div>
          <div class="cp-panel active" id="panelDate">
            <div class="cp-month-nav">
              <button id="cpPrevMonth">‹</button>
              <span class="label" id="cpMonthLabel"></span>
              <button id="cpNextMonth">›</button>
            </div>
            <div class="cp-grid" id="cpGrid"></div>
          </div>
          <div class="cp-panel" id="panelWeek">
            <div class="week-list" id="weekList"></div>
          </div>
        </div>
      </div>
      <div class="view-toggle">
        <button id="viewWeekBtn" data-view="week">週</button>
        <button id="viewDayBtn" data-view="day">日</button>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--blue-600)"></span>循環日 (Day)</span>
    <span><span class="dot" style="background:var(--amber-500)"></span>DAY S 特別活動日</span>
    <span><span class="dot" style="background:var(--red-500)"></span>DAY E 考試日</span>
    <span><span class="dot" style="background:var(--violet-500)"></span>DAY TD 教師專業發展日</span>
    <span><span class="dot" style="background:var(--grey-400)"></span>未設定</span>
  </div>

  <div id="dayBannerHost"></div>
  <div id="daySingleHead"></div>

  <div class="grid-wrap">
    <table class="tt" id="ttTable"></table>
  </div>
</div>

    {key:'period2',       label:'第3節',    time:'09:35-10:10', idx:2},
    {key:'break1',        label:'小息一',   time:'10:10-10:25', fixed:true, merged:true},
    {key:'period3',       label:'第4節',    time:'10:25-11:00', idx:3},
    {key:'period4',       label:'第5節',    time:'11:00-11:35', idx:4},
    {key:'break2',        label:'小息二',   time:'11:35-11:50', fixed:true, merged:true},
    {key:'period5',       label:'第6節',    time:'11:50-12:25', idx:5},
    {key:'period6',       label:'第7節',    time:'12:25-13:00', idx:6},
    {key:'lunch',         label:'午膳',     time:'13:00-13:30', fixed:true, merged:true},
    {key:'break3',        label:'小息三',   time:'13:30-14:00', fixed:true, merged:true},
    {key:'period7',       label:'第8節',    time:'14:00-14:35', idx:7},
    {key:'period9',       label:'第9節',    time:'14:35-15:20', weekdayBased:true},
  ];

  // ---------- date helpers ----------
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function toKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function startOfWeek(d){ // Monday
    const r = new Date(d);
    const dow = r.getDay(); // 0 Sun .. 6 Sat
    const diff = (dow === 0) ? -6 : (1 - dow);
    r.setDate(r.getDate() + diff);
    r.setHours(0,0,0,0);
    return r;
  }
  function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function weekdayIdx(d){ const dow = d.getDay(); return (dow>=1 && dow<=5) ? dow : null; } // 1..5 = Mon..Fri

  function dayInfo(key){
    const v = DAY_MAP[key];
    if(!v) return {type:'unset'};
    if(v.indexOf('Day') === 0) return {type:'schoolday', day:v};
    return {type:'special', code:v, detail: SPECIAL_DAYS[key]};
  }
  function cycleParity(key){
    const wk = CYCLE_WEEK[key];
    if(!wk) return null;
    return {week:wk, parity: (wk % 2 === 1) ? 'odd' : 'even'};
  }

  // ---------- state ----------
  const state = {
    date: new Date(),
    view: (window.matchMedia('(max-width: 768px)').matches) ? 'day' : 'week',
    teacherIdx: 0,
    calOpen: false,
    calTab: 'date',
    calMonthCursor: new Date()
  };
  state.date.setHours(0,0,0,0);

  // ---------- cell content ----------
  function getCellContent(teacher, rowDef, date){
    const key = toKey(date);
    const wIdx = weekdayIdx(date);
    const info = dayInfo(key);

    if(!wIdx){ return {state:'unset'}; }
    if(info.type === 'unset'){ return {state:'unset'}; }
    if(info.type === 'special'){ return {state:'special', code: info.code}; }

    const wd = WEEKDAY_KEYS[wIdx];

    if(rowDef.key === 'earlyExercise'){
      if(wIdx !== 1) return {state:'empty'};
      return teacher.earlyExercise ? {state:'filled', main: teacher.earlyExercise} : {state:'empty'};
    }
    if(rowDef.key === 'assembly'){
      const main = teacher.assemblyMain[wd] || '';
      const sub = teacher.assemblySub[wd] || '';
      if(!main && !sub) return {state:'empty'};
      return {state:'filled', main:main, sub:sub};
    }
    if(rowDef.key === 'homeroom'){
      return teacher.homeroom ? {state:'filled', main: teacher.homeroom} : {state:'empty'};
    }
    if(rowDef.weekdayBased){
      const e = teacher.period9[wd];
      return e ? {state:'filled', main:e.subject} : {state:'empty'};
    }
    if(rowDef.idx !== undefined){
      const dayKey = info.day; // Day1..Day6
      const period = teacher.periods[rowDef.idx];
      const e = period.byDay[dayKey];
      if(!e) return {state:'empty'};
      if(e.parity){
        const par = cycleParity(key);
        if(!par || par.parity !== e.parity) return {state:'empty'};
      }
      return {state:'filled', main:e.subject, sub:e.location};
    }
    return {state:'empty'};
  }

  // ---------- rendering ----------
  function currentTeacher(){ return TEACHERS[state.teacherIdx]; }

  function populateTeacherSelect(){
    const sel = document.getElementById('teacherSelect');
    sel.innerHTML = '';
    TEACHERS.forEach((t, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = t.name;
      sel.appendChild(opt);
    });
    sel.value = state.teacherIdx;
    sel.addEventListener('change', () => {
      state.teacherIdx = Number(sel.value);
      renderAll();
    });
  }

  function renderTitle(){
    const el = document.getElementById('calTitle');
    let refDate;
    if(state.view === 'week'){
      const mon = startOfWeek(state.date);
      refDate = addDays(mon, 2); // Wednesday represents the week's month
    } else {
      refDate = state.date;
    }
    let html = refDate.getFullYear() + '年' + MONTH_ZH(refDate.getMonth()+1);
    const key = toKey(state.view === 'week' ? refDate : state.date);
    const par = cycleParity(toKey(state.view === 'week' ? refDate : state.date));
    if(par){
      html += '<span class="weekbadge">第 ' + par.week + ' 循環週 · ' + (par.parity==='odd' ? '單週' : '雙週') + '</span>';
    }
    el.innerHTML = html;
  }

  function badgeHtml(info){
    if(info.type === 'schoolday'){
      return '<span class="badge">' + info.day.replace('Day','Day ') + '</span>';
    }
    if(info.type === 'special'){
      return '<span class="badge special-' + info.code + '">DAY ' + info.code + '</span>';
    }
    return '<span class="badge unset">未設定</span>';
  }

  function cellHtml(content, merged){
    if(content.state === 'unset' || content.state === 'special'){
      return '<td class="cell empty"></td>';
    }
    if(content.state === 'empty'){
      return '<td class="cell empty"></td>';
    }
    if(merged){
      return '<td class="cell merged">' + escapeHtml(content.main) + '</td>';
    }
    let html = '<span class="subj fixed-main">' + escapeHtml(content.main) + '</span>';
    if(content.sub){
      html += '<span class="loc fixed-sub">' + escapeHtml(content.sub) + '</span>';
    }
    return '<td class="cell">' + html + '</td>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderWeek(){
    const table = document.getElementById('ttTable');
    const teacher = currentTeacher();
    const mon = startOfWeek(state.date);
    const days = [1,2,3,4,5].map(i => addDays(mon, i-1));
    const today = new Date(); today.setHours(0,0,0,0);

    let thead = '<thead><tr><th class="corner col-label">節數</th>';
    days.forEach((d, i) => {
      const key = toKey(d);
      const info = dayInfo(key);
      const isToday = sameDate(d, today);
      thead += '<th class="daycol' + (isToday?' is-today':'') + '">' +
        '<div class="wd">' + WEEKDAY_NAMES[i+1] + '</div>' +
        '<div class="dnum">' + d.getDate() + '</div>' +
        badgeHtml(info) +
        '</th>';
    });
    thead += '</tr></thead>';

    let tbody = '<tbody>';
    ROWS.forEach(rowDef => {
      const rowClass = rowDef.fixed ? 'fixed-row' : '';
      tbody += '<tr class="' + rowClass + '">';
      tbody += '<td class="period-label">' + rowDef.label + '<span class="time">' + rowDef.time + '</span></td>';

      if(rowDef.merged){
        // check if ALL weekdays are 'unset' or 'special' -> render empty merged; else show label once across span
        // Determine per-day contents to decide if any school day exists this week
        let anySchool = days.some(d => dayInfo(toKey(d)).type !== 'unset' && dayInfo(toKey(d)).type !== 'special');
        if(!anySchool){
          tbody += '<td class="cell empty" colspan="5"></td>';
        } else {
          const sample = getCellContent(teacher, rowDef, days.find(d => dayInfo(toKey(d)).type === 'schoolday') || days[0]);
          const text = (sample.state === 'filled') ? sample.main : rowDef.label;
          tbody += '<td class="cell merged" colspan="5">' + escapeHtml(text) + '</td>';
        }
      } else {
        days.forEach(d => {
          const key = toKey(d);
          const isToday = sameDate(d, today);
          const content = getCellContent(teacher, rowDef, d);
          let td = cellHtml(content, false);
          if(isToday){ td = td.replace('class="cell', 'class="cell is-today'); }
          tbody += td;
        });
      }
      tbody += '</tr>';
    });
    tbody += '</tbody>';

    table.innerHTML = thead + tbody;
    document.getElementById('dayBannerHost').innerHTML = '';
    document.getElementById('daySingleHead').innerHTML = '';
  }

  function renderDay(){
    const table = document.getElementById('ttTable');
    const teacher = currentTeacher();
    const d = state.date;
    const key = toKey(d);
    const info = dayInfo(key);
    const wIdx = weekdayIdx(d);

    // single day head
    const headHost = document.getElementById('daySingleHead');
    headHost.innerHTML = '<div class="day-single-head">' +
      '<div class="dow">' + (wIdx ? WEEKDAY_NAMES[wIdx] : DOW_toFull(d.getDay())) + '</div>' +
      '<div class="dnum">' + d.getDate() + ' 日</div>' +
      badgeHtml(wIdx ? info : {type:'unset'}) +
      '</div>';

    // banner
    const bannerHost = document.getElementById('dayBannerHost');
    if(!wIdx){
      bannerHost.innerHTML = '<div class="daybanner weekend">今天是週末，沒有課堂安排。</div>';
    } else if(info.type === 'special'){
      const label = SPECIAL_LABELS[info.code] || info.code;
      const detail = info.detail ? (info.detail.event || '') : '';
      bannerHost.innerHTML = '<div class="daybanner special-' + info.code + '"><b>DAY ' + info.code + ' · ' + label + '</b>&nbsp; ' + escapeHtml(detail) + '</div>';
    } else if(info.type === 'unset'){
      bannerHost.innerHTML = '<div class="daybanner unset">此日期尚未設定循環日資料。</div>';
    } else {
      bannerHost.innerHTML = '';
    }

    let thead = '<thead><tr><th class="corner col-label">節數</th><th class="daycol">當日課堂</th></tr></thead>';
    let tbody = '<tbody>';

    if(!wIdx || info.type === 'special' || info.type === 'unset'){
      tbody += '</tbody>';
      table.innerHTML = thead + tbody;
      return;
    }

    ROWS.forEach(rowDef => {
      const rowClass = rowDef.fixed ? 'fixed-row' : '';
      tbody += '<tr class="' + rowClass + '">';
      tbody += '<td class="period-label">' + rowDef.label + '<span class="time">' + rowDef.time + '</span></td>';
      const content = getCellContent(teacher, rowDef, d);
      if(rowDef.merged){
        const text = (content.state === 'filled') ? content.main : rowDef.label;
        tbody += '<td class="cell merged">' + escapeHtml(text) + '</td>';
      } else {
        tbody += cellHtml(content, false);
      }
      tbody += '</tr>';
    });
    tbody += '</tbody>';
    table.innerHTML = thead + tbody;
  }

  function DOW_toFull(dow){ return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dow]; }

  function renderGrid(){
    if(state.view === 'week') renderWeek(); else renderDay();
  }

  function renderViewToggle(){
    document.getElementById('viewWeekBtn').classList.toggle('active', state.view === 'week');
    document.getElementById('viewDayBtn').classList.toggle('active', state.view === 'day');
    document.body.classList.toggle('day-view', state.view === 'day');
  }

  function renderAll(){
    renderTitle();
    renderViewToggle();
    renderGrid();
    if(state.calOpen) renderCalendarPopover();
  }

  // ---------- calendar popover ----------
  function renderCalendarPopover(){
    document.getElementById('tabDate').classList.toggle('active', state.calTab==='date');
    document.getElementById('tabWeek').classList.toggle('active', state.calTab==='week');
    document.getElementById('panelDate').classList.toggle('active', state.calTab==='date');
    document.getElementById('panelWeek').classList.toggle('active', state.calTab==='week');

    if(state.calTab === 'date'){
      renderMonthGrid();
    } else {
      renderWeekList();
    }
  }

  function renderMonthGrid(){
    const cursor = state.calMonthCursor;
    const y = cursor.getFullYear(), m = cursor.getMonth();
    document.getElementById('cpMonthLabel').textContent = y + '年' + MONTH_ZH(m+1);
    const grid = document.getElementById('cpGrid');
    let html = '';
    ['一','二','三','四','五','六','日'].forEach(l => html += '<div class="dow">' + l + '</div>');

    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() === 0) ? 6 : first.getDay()-1; // Monday-first
    const gridStart = addDays(first, -startOffset);
    const today = new Date(); today.setHours(0,0,0,0);

    for(let i=0;i<42;i++){
      const d = addDays(gridStart, i);
      const key = toKey(d);
      const inMonth = d.getMonth() === m;
      const isWeekend = !weekdayIdx(d);
      const info = dayInfo(key);
      const isSchool = !isWeekend && (info.type !== 'unset');
      const classes = ['cp-day'];
      if(!inMonth) classes.push('out');
      if(isWeekend) classes.push('weekend');
      if(isSchool) classes.push('school'); else if(inMonth && !isWeekend) classes.push('disabled');
      if(sameDate(d, today)) classes.push('today');
      if(sameDate(d, state.date)) classes.push('selected');
      html += '<button type="button" class="' + classes.join(' ') + '" data-key="' + key + '">' + d.getDate() + '</button>';
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cp-day').forEach(btn => {
      btn.addEventListener('click', () => {
        state.date = fromKey(btn.dataset.key);
        closeCalendar();
        renderAll();
      });
    });
  }

  function renderWeekList(){
    const host = document.getElementById('weekList');
    let html = '';
    WEEKS.forEach(w => {
      html += '<button type="button" class="week-item" data-date="' + w.firstDate + '">' +
        '<b>第 ' + w.week + ' 循環週 · ' + (w.week % 2 === 1 ? '單週' : '雙週') + '</b>' +
        '<span class="range">' + w.label + '</span>' +
        '</button>';
    });
    host.innerHTML = html;
    host.querySelectorAll('.week-item').forEach(btn => {
      btn.addEventListener('click', () => {
        state.date = fromKey(btn.dataset.date);
        state.calMonthCursor = new Date(state.date);
        closeCalendar();
        renderAll();
      });
    });
  }

  function openCalendar(){
    state.calOpen = true;
    state.calMonthCursor = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
    document.getElementById('calPop').classList.add('open');
    renderCalendarPopover();
  }
  function closeCalendar(){
    state.calOpen = false;
    document.getElementById('calPop').classList.remove('open');
  }

  // ---------- navigation ----------
  function goPrev(){
    state.date = addDays(state.date, state.view === 'week' ? -7 : -1);
    renderAll();
  }
  function goNext(){
    state.date = addDays(state.date, state.view === 'week' ? 7 : 1);
    renderAll();
  }
  function goToday(){
    state.date = new Date(); state.date.setHours(0,0,0,0);
    renderAll();
  }
  function setView(v){
    state.view = v;
    renderAll();
  }

  // ---------- init ----------
  function init(){
    populateTeacherSelect();
    renderAll();

    document.getElementById('prevBtn').addEventListener('click', goPrev);
    document.getElementById('nextBtn').addEventListener('click', goNext);
    document.getElementById('todayBtn').addEventListener('click', goToday);
    document.getElementById('viewWeekBtn').addEventListener('click', () => setView('week'));
    document.getElementById('viewDayBtn').addEventListener('click', () => setView('day'));

    document.getElementById('calBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if(state.calOpen) closeCalendar(); else openCalendar();
    });
    document.getElementById('calPop').addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => { if(state.calOpen) closeCalendar(); });

    document.getElementById('tabDate').addEventListener('click', () => { state.calTab='date'; renderCalendarPopover(); });
    document.getElementById('tabWeek').addEventListener('click', () => { state.calTab='week'; renderCalendarPopover(); });

    document.getElementById('cpPrevMonth').addEventListener('click', () => {
      state.calMonthCursor = new Date(state.calMonthCursor.getFullYear(), state.calMonthCursor.getMonth()-1, 1);
      renderMonthGrid();
    });
    document.getElementById('cpNextMonth').addEventListener('click', () => {
      state.calMonthCursor = new Date(state.calMonthCursor.getFullYear(), state.calMonthCursor.getMonth()+1, 1);
      renderMonthGrid();
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
