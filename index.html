<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樂華天主教小學 - 時間表查詢系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .active-tab {
            background-color: #2563eb;
            color: white;
        }
        .calendar-cell {
            min-height: 100px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 頂部導航欄 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <!-- 上層：身份與對象選擇 -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="calendar" class="w-6 h-6 text-blue-600"></i>
                    <h1 class="text-xl font-bold text-slate-900">時間表查詢系統</h1>
                </div>

                <!-- 模式與對象選擇器 -->
                <div class="flex items-center gap-3">
                    <div class="inline-flex rounded-lg border border-slate-200 p-1 bg-slate-100">
                        <button id="btn-mode-class" onclick="switchIdentity('class')" class="px-3 py-1.5 text-sm font-medium rounded-md transition-all active-tab">班別時間表</button>
                        <button id="btn-mode-teacher" onclick="switchIdentity('teacher')" class="px-3 py-1.5 text-sm font-medium rounded-md transition-all text-slate-600">教師個人時間表</button>
                    </div>

                    <select id="select-target" onchange="renderSchedule()" class="bg-white border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 font-medium shadow-sm">
                        <!-- 動態載入班別或教師 -->
                    </select>
                </div>
            </div>

            <!-- 下層：日期控制與標題欄 -->
            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                <!-- 左上邊控制區：< 今日 月曆 > -->
                <div class="flex items-center gap-1 sm:gap-2">
                    <button onclick="navigateDate(-1)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition" title="上一頁">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button onclick="goToToday()" class="px-3 py-1.5 text-sm font-semibold text-blue-600 hover:bg-blue-50 rounded-lg border border-blue-200 transition">
                        今日
                    </button>
                    <div class="relative">
                        <input type="date" id="date-picker" onchange="onDatePicked(this.value)" class="absolute opacity-0 w-full h-full cursor-pointer left-0 top-0">
                        <button class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition" title="選擇日期">
                            <i data-lucide="calendar-days" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <button onclick="navigateDate(1)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition" title="下一頁">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- 置中標題：年月 -->
                <div id="header-title" class="text-lg sm:text-xl font-bold text-slate-800 text-center">
                    2026年3月
                </div>

                <!-- 右上角：視圖切換按鈕 -->
                <div class="inline-flex rounded-lg border border-slate-200 p-1 bg-slate-100">
                    <button id="btn-view-week" onclick="setViewMode('week')" class="px-3 py-1 text-sm font-medium rounded-md transition-all">週</button>
                    <button id="btn-view-day" onclick="setViewMode('day')" class="px-3 py-1 text-sm font-medium rounded-md transition-all">日</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 時間表內容顯示區域 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        <!-- 狀態提示列 (顯示循環週/特別日子) -->
        <div id="status-bar" class="mb-4 p-3 bg-blue-50 border border-blue-200 text-blue-800 rounded-lg flex items-center justify-between text-sm font-medium">
            <!-- 動態插入資訊 -->
        </div>

        <!-- 時間表容器 -->
        <div id="schedule-container" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
            <!-- 內容由 JS 動態生成 -->
        </div>
    </main>

    <script>
        // --- 1. 資料庫模組 (模擬從 Excel / Docx 解析後的資料) ---
        const schoolCalendar = {
            // 格式: YYYY-MM-DD: { day: 'D1'~'D6'|'S'|'TD'|'E'|'HOLIDAY', weekNum: 循環週次 }
            "2026-09-01": { day: "S", weekNum: 1, note: "開學日" },
            "2026-09-04": { day: "D1", weekNum: 1, note: "按時間表上課" },
            "2026-09-07": { day: "D2", weekNum: 1 },
            "2026-09-08": { day: "D3", weekNum: 1 },
            "2026-09-09": { day: "D4", weekNum: 1 },
            "2026-09-10": { day: "D5", weekNum: 1 },
            "2026-09-11": { day: "D6", weekNum: 1 },
            "2026-03-01": { day: "D2", weekNum: 17 },
            "2026-03-02": { day: "D3", weekNum: 17 },
            "2026-03-03": { day: "D4", weekNum: 17 },
            "2026-03-04": { day: "E", weekNum: 17, note: "考試日" },
            "2026-03-05": { day: "E", weekNum: 17, note: "考試日" },
            "2026-03-15": { day: "D5", weekNum: 18 },
            "2026-03-16": { day: "D6", weekNum: 18 },
            "2026-03-17": { day: "D1", weekNum: 18 },
            "2026-03-18": { day: "D2", weekNum: 18 },
            "2026-03-19": { day: "D3", weekNum: 18 },
        };

        const timeSlots = [
            { id: "p0", time: "07:55-08:00", name: "早操" },
            { id: "p1", time: "08:00-08:10", name: "早會及早禱" },
            { id: "p2", time: "08:10-08:25", name: "班主任課" },
            { id: "p3", time: "08:25-09:00", name: "第1節" },
            { id: "p4", time: "09:00-09:35", name: "第2節" },
            { id: "p5", time: "09:35-10:10", name: "第3節" },
            { id: "b1", time: "10:10-10:25", name: "小息一" },
            { id: "p6", time: "10:25-11:00", name: "第4節" },
            { id: "p7", time: "11:00-11:35", name: "第5節" },
            { id: "p8", time: "11:35-12:10", name: "第6節" },
            { id: "l1", time: "12:10-13:10", name: "午膳及小息" },
            { id: "p9", time: "13:10-13:45", name: "第7節" },
            { id: "p10", time: "13:45-14:20", name: "第8節" },
            { id: "p11", time: "14:20-14:55", name: "第9節" },
            { id: "p12", time: "14:55-15:10", name: "綜合個人學習時間" }
        ];

        const classesList = ["1A", "1B", "1C", "1D", "4A", "4B", "5A", "6A"];
        const teachersList = ["許碧玉老師", "林紫茵老師", "楊嘉慧老師", "王新燕老師", "葉子澄老師"];

        // 範例課表資料結構 [Day][SlotIndex]
        const sampleSchedule = {
            "D1": { p3: "音樂", p4: "中文", p5: "中文", p6: "英文(NET)", p7: "數學", p8: "體育", p9: "人文", p10: "宗教", p11: "閱讀" },
            "D2": { p3: "英默", p4: "英默", p5: "數學", p6: "中默", p7: "中文", p8: "中文", p9: "視藝", p10: "視藝", p11: "班會" },
            "D3": { p3: "科學", p4: "科學", p5: "中文", p6: "資訊科技", p7: "英文", p8: "英文", p9: "數學", p10: "體育", p11: "導修" },
            "D4": { p3: "英文", p4: "數學", p5: "人文", p6: "中文", p7: "中文", p8: "音樂", p9: "科學", p10: "普通話", p11: "導修" },
            "D5": { p3: "英文(NET)", p4: "英文(NET)", p5: "數學", p6: "視藝", p7: "中文", p8: "中文", p9: "人文", p10: "體育", p11: "導修" },
            "D6": { p3: "中文", p4: "體育", p5: "科學", p6: "英文", p7: "英文", p8: "數學", p9: "數學", p10: "宗教", p11: "週會" }
        };

        // --- 2. 系統狀態 ---
        let currentIdentity = 'class'; // 'class' 或 'teacher'
        let currentTarget = '1A';
        let currentDate = new Date(2026, 2, 16); // 預設 2026年3月16日
        let currentView = 'week'; // 'week' 或 'day'

        // --- 3. 初始化與響應式邏輯 ---
        window.addEventListener('DOMContentLoaded', () => {
            // 預設裝置判定：手機預設日檢視，電腦/平板預設週檢視
            if (window.innerWidth < 768) {
                currentView = 'day';
            } else {
                currentView = 'week';
            }
            
            updateSelectOptions();
            renderSchedule();
            lucide.createIcons();
        });

        // --- 4. 界面互動與邏輯處理 ---
        function switchIdentity(identity) {
            currentIdentity = identity;
            document.getElementById('btn-mode-class').className = `px-3 py-1.5 text-sm font-medium rounded-md transition-all ${identity === 'class' ? 'active-tab' : 'text-slate-600'}`;
            document.getElementById('btn-mode-teacher').className = `px-3 py-1.5 text-sm font-medium rounded-md transition-all ${identity === 'teacher' ? 'active-tab' : 'text-slate-600'}`;
            updateSelectOptions();
            renderSchedule();
        }

        function updateSelectOptions() {
            const select = document.getElementById('select-target');
            select.innerHTML = '';
            const list = currentIdentity === 'class' ? classesList : teachersList;
            list.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                select.appendChild(opt);
            });
            currentTarget = list[0];
        }

        function setViewMode(mode) {
            currentView = mode;
            document.getElementById('btn-view-week').className = `px-3 py-1 text-sm font-medium rounded-md transition-all ${mode === 'week' ? 'active-tab' : 'text-slate-600'}`;
            document.getElementById('btn-view-day').className = `px-3 py-1 text-sm font-medium rounded-md transition-all ${mode === 'day' ? 'active-tab' : 'text-slate-600'}`;
            renderSchedule();
        }

        function navigateDate(direction) {
            if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (direction * 7));
            } else {
                currentDate.setDate(currentDate.getDate() + direction);
            }
            renderSchedule();
        }

        function goToToday() {
            currentDate = new Date();
            renderSchedule();
        }

        function onDatePicked(val) {
            if (val) {
                currentDate = new Date(val);
                renderSchedule();
            }
        }

        function formatDateKey(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getScienceOrITSubject(grade, isEvenWeek, baseSubject) {
            // 四至六年級單/雙週切換邏輯
            if (grade >= 4 && (baseSubject === '科學' || baseSubject === '資訊科技')) {
                return isEvenWeek ? '資訊科技' : '科學';
            }
            return baseSubject;
        }

        // --- 5. 渲染視圖 ---
        function renderSchedule() {
            currentTarget = document.getElementById('select-target').value || currentTarget;
            
            // 更新置中標題 (年月)
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            document.getElementById('header-title').textContent = `${year}年${month}月`;

            const container = document.getElementById('schedule-container');
            const statusBar = document.getElementById('status-bar');

            if (currentView === 'week') {
                renderWeekView(container, statusBar);
            } else {
                renderDayView(container, statusBar);
            }
            lucide.createIcons();
        }

        // 渲染週曆檢視
        function renderWeekView(container, statusBar) {
            // 計算當前星期的週一日期
            const startOfWeek = new Date(currentDate);
            const dayOfWeek = startOfWeek.getDay();
            const diff = startOfWeek.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            startOfWeek.setDate(diff);

            let weekDays = [];
            for (let i = 0; i < 5; i++) { // 顯示星期一至五
                let d = new Date(startOfWeek);
                d.setDate(d.getDate() + i);
                weekDays.push(d);
            }

            const firstDayKey = formatDateKey(weekDays[0]);
            const calInfo = schoolCalendar[firstDayKey] || { weekNum: 1 };
            const isEvenWeek = (calInfo.weekNum % 2 === 0);

            statusBar.innerHTML = `
                <div><span class="font-bold">目前顯示：</span>${currentTarget} (${currentIdentity === 'class' ? '班別' : '教師'})</div>
                <div><span class="font-bold">循環週次：</span>第 ${calInfo.weekNum} 週 (${isEvenWeek ? '雙週' : '單週'})</div>
            `;

            let html = `
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-700">
                            <th class="p-3 border-r border-slate-200 w-28 text-sm font-semibold">時間 / 節次</th>
            `;

            const weekNames = ["一", "二", "三", "四", "五"];
            weekDays.forEach((d, idx) => {
                const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
                const key = formatDateKey(d);
                const dayCal = schoolCalendar[key] || { day: "D" + (idx + 1) };
                html += `
                    <th class="p-2 border-r border-slate-200 min-w-[120px]">
                        <div class="text-xs text-slate-500">星期${weekNames[idx]}</div>
                        <div class="text-sm font-bold">${dateStr}</div>
                        <div class="inline-block mt-1 px-2 py-0.5 text-xs font-semibold rounded bg-blue-100 text-blue-700">${dayCal.day}</div>
                    </th>
                `;
            });
            html += `</tr></thead><tbody>`;

            // 課節渲染
            timeSlots.forEach(slot => {
                const isRest = slot.id.startsWith('b') || slot.id.startsWith('l') || slot.id.startsWith('p0') || slot.id.startsWith('p1') || slot.id.startsWith('p2');
                const rowBg = isRest ? "bg-slate-50/50 text-slate-500" : "hover:bg-slate-50/80";

                html += `<tr class="border-b border-slate-200 ${rowBg}">
                    <td class="p-2 border-r border-slate-200 font-medium text-xs">
                        <div>${slot.name}</div>
                        <div class="text-[10px] text-slate-400">${slot.time}</div>
                    </td>`;

                weekDays.forEach((d) => {
                    const key = formatDateKey(d);
                    const dayCal = schoolCalendar[key] || { day: "D1" };
                    const dayCode = dayCal.day; // D1-D6, S, TD, E

                    if (["S", "TD", "E"].includes(dayCode)) {
                        const bgMap = { "S": "bg-yellow-50 text-yellow-800", "TD": "bg-purple-50 text-purple-800", "E": "bg-red-50 text-red-800" };
                        const nameMap = { "S": "特別活動", "TD": "教師發展日", "E": "考試日" };
                        html += `<td class="p-2 border-r border-slate-200 ${bgMap[dayCode]} font-bold text-xs">${nameMap[dayCode]}</td>`;
                    } else if (sampleSchedule[dayCode]) {
                        let subject = sampleSchedule[dayCode][slot.id] || "-";
                        // 處理高年級單雙週
                        const grade = parseInt(currentTarget) || 4;
                        subject = getScienceOrITSubject(grade, isEvenWeek, subject);

                        html += `<td class="p-2 border-r border-slate-200 text-sm font-medium">${subject}</td>`;
                    } else {
                        html += `<td class="p-2 border-r border-slate-200 text-sm text-slate-400">-</td>`;
                    }
                });

                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // 渲染日曆檢視
        function renderDayView(container, statusBar) {
            const dateKey = formatDateKey(currentDate);
            const calInfo = schoolCalendar[dateKey] || { day: "D1", weekNum: 1 };
            const isEvenWeek = (calInfo.weekNum % 2 === 0);
            const weekNames = ["日", "一", "二", "三", "四", "五", "六"];
            const dayOfWeekStr = weekNames[currentDate.getDay()];

            statusBar.innerHTML = `
                <div><span class="font-bold">目前顯示：</span>${currentTarget} (${currentDate.getMonth() + 1}月${currentDate.getDate()}日 星期${dayOfWeekStr})</div>
                <div><span class="font-bold">課堂類型：</span><span class="px-2 py-0.5 rounded bg-blue-100 text-blue-700 font-bold text-xs">${calInfo.day}</span></div>
            `;

            let html = `
                <div class="divide-y divide-slate-200">
                    <div class="p-3 bg-slate-100 font-bold text-slate-700 text-center flex justify-between items-center px-6">
                        <span>時間與節次</span>
                        <span>科目 / 活動</span>
                    </div>
            `;

            timeSlots.forEach(slot => {
                const dayCode = calInfo.day;
                let subject = "-";

                if (["S", "TD", "E"].includes(dayCode)) {
                    const nameMap = { "S": "特別活動日 (不用按時間表上課)", "TD": "教師專業發展日 (學生假期)", "E": "考試日" };
                    subject = nameMap[dayCode];
                } else if (sampleSchedule[dayCode]) {
                    const baseSubject = sampleSchedule[dayCode][slot.id] || "-";
                    const grade = parseInt(currentTarget) || 4;
                    subject = getScienceOrITSubject(grade, isEvenWeek, baseSubject);
                }

                const isRest = slot.id.startsWith('b') || slot.id.startsWith('l') || slot.id.startsWith('p0') || slot.id.startsWith('p1') || slot.id.startsWith('p2');

                html += `
                    <div class="p-4 flex items-center justify-between ${isRest ? 'bg-slate-50' : 'bg-white'} hover:bg-slate-50 transition">
                        <div class="flex flex-col">
                            <span class="font-bold text-slate-800 text-sm">${slot.name}</span>
                            <span class="text-xs text-slate-400">${slot.time}</span>
                        </div>
                        <div class="text-base font-semibold ${isRest ? 'text-slate-500' : 'text-blue-600'}">
                            ${subject}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
